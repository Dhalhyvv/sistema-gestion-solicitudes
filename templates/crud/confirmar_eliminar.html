{% extends 'base.html' %}
{% block title %}{{ titulo }}{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-6">
        <div class="card border-danger shadow-sm">
            <div class="card-header bg-danger text-white"><h2 class="h5 mb-0">{{ titulo }}</h2></div>
            <div class="card-body">
                <p class="lead">¿Está seguro de que desea eliminar <strong>{{ object }}</strong>?</p>
                <p class="text-muted">Esta acción no se puede deshacer.</p>
                <form method="post">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-danger">Sí, eliminar</button>
                    <a class="btn btn-outline-secondary" href="{% url url_lista %}">Cancelar</a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
