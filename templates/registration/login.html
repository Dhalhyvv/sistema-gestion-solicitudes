{% extends 'base.html' %}
{% block title %}Iniciar sesión{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
        <div class="card shadow-sm">
            <div class="card-header bg-primary text-white"><h2 class="h5 mb-0">Iniciar sesión</h2></div>
            <div class="card-body">
                <form method="post" novalidate>
                    {% csrf_token %}
                    {% if form.non_field_errors %}<div class="alert alert-danger">{{ form.non_field_errors }}</div>{% endif %}
                    <div class="mb-3">
                        <label class="form-label" for="{{ form.username.id_for_label }}">Usuario</label>
                        {{ form.username }}
                    </div>
                    <div class="mb-3">
                        <label class="form-label" for="{{ form.password.id_for_label }}">Contraseña</label>
                        {{ form.password }}
                    </div>
                    <input type="hidden" name="next" value="{{ next }}">
                    <button type="submit" class="btn btn-primary w-100">Ingresar</button>
                </form>
                <div class="text-center mt-3">
                    <a href="{% url 'password_reset' %}">¿Olvidó su contraseña?</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
